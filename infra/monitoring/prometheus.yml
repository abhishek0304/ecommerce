{
  "global": {
    "scrape_interval": "15s",
    "evaluation_interval": "15s"
  },
  "rule_files": [
    "/etc/prometheus/alerts.yml"
  ],
  "alerting": {
    "alertmanagers": [
      {
        "static_configs": [
          {
            "targets": [
              "alertmanager:9093"
            ]
          }
        ]
      }
    ]
  },
  "scrape_configs": [
    {
      "job_name": "ecommerce",
      "metrics_path": "/actuator/prometheus",
      "static_configs": [
        {
          "targets": [
            "api-gateway:9090"
          ],
          "labels": {
            "application": "api-gateway"
          }
        },
        {
          "targets": [
            "user-service:9090"
          ],
          "labels": {
            "application": "user-service"
          }
        },
        {
          "targets": [
            "product-service:9090"
          ],
          "labels": {
            "application": "product-service"
          }
        },
        {
          "targets": [
            "cart-service:9090"
          ],
          "labels": {
            "application": "cart-service"
          }
        },
        {
          "targets": [
            "order-service:9090"
          ],
          "labels": {
            "application": "order-service"
          }
        },
        {
          "targets": [
            "notification-service:9090"
          ],
          "labels": {
            "application": "notification-service"
          }
        }
      ]
    }
  ]
}
