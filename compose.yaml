        "TWILIO_WHATSAPP_CONTENT_SID": "${TWILIO_WHATSAPP_CONTENT_SID:-}",
        "SPRING_PROFILES_ACTIVE": "container",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:19092",
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.ps1 first}",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?Run scripts/init-env.ps1 first}",
        "PRODUCT_SERVICE_URL": "http://product-service:8083",
        "CART_SERVICE_URL": "http://cart-service:8084",
        "USER_SERVICE_URL": "http://user-service:8082",
        "SPRING_DATASOURCE_URL": "jdbc:mysql://notification-db:3306/notificationdb",
        "SPRING_DATASOURCE_USERNAME": "notification",
        "SPRING_DATASOURCE_PASSWORD": "${NOTIFICATION_DB_PASSWORD}",
        "SPRING_CLOUD_CONFIG_ENABLED": "false",
        "CONFIG_SERVER_IMPORT": "classpath:/application-container.properties",
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=50.0 -XX:ReservedCodeCacheSize=64m -Xss512k",
        "SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE": "5",
        "SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE": "1",
        "TRACING_SAMPLE_RATE": "${TRACING_SAMPLE_RATE:-1.0}",
        "MANAGEMENT_TRACING_ENABLED": "${MANAGEMENT_TRACING_ENABLED:-true}",
        "OTLP_TRACES_ENDPOINT": "${OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      },
      "depends_on": {
        "service-registry": {
          "condition": "service_healthy"
        },
        "kafka": {
          "condition": "service_healthy"
        },
        "notification-db": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:9090/actuator/health/readiness"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 24,
        "start_period": "60s"
      }
    },
    "tempo": {
      "image": "grafana/tempo:2.7.2",
      "profiles": [
        "observability"
      ],
      "command": [
        "-config.file=/etc/tempo.yaml"
      ],
      "volumes": [
        "./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro",
        "tempo-data:/var/tempo"
      ],
      "ports": [
        "127.0.0.1:4318:4318",
        "127.0.0.1:3200:3200"
      ]
    },
    "grafana": {
      "image": "grafana/grafana:12.3.4",
      "profiles": [
        "observability"
      ],
      "ports": [
        "127.0.0.1:3000:3000"
      ],
      "environment": {
        "GF_AUTH_ANONYMOUS_ENABLED": "true",
        "GF_AUTH_ANONYMOUS_ORG_ROLE": "Editor",
        "GF_USERS_ALLOW_SIGN_UP": "false",
        "GF_ANALYTICS_REPORTING_ENABLED": "false"
      },
      "volumes": [
        "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"
      ],
      "depends_on": [
        "tempo"
      ],
      "restart": "unless-stopped",
      "mem_limit": "256m"
    }
  },
  "volumes": {
    "user-db": {},
    "product-db": {},
    "cart-db": {},
    "order-db": {},
    "notification-db": {},
    "kafka-data": {},
    "tempo-data": {}
  }
}
