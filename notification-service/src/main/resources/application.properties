spring.application.name=notification-service
spring.config.import=${CONFIG_SERVER_IMPORT:configserver:http://localhost:8080}
server.port=8086
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/notificationdb}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:root}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.operation-timeout=10s
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
management.endpoints.web.exposure.include=health,info
internal.service-key=${INTERNAL_SERVICE_KEY:local-development-service-key-change-me}
services.user-url=${USER_SERVICE_URL:http://localhost:8082}
messages.email.enabled=${EMAIL_ENABLED:false}
messages.email.from=${EMAIL_FROM:}
messages.sms.enabled=${SMS_ENABLED:false}
messages.sms.from=${TWILIO_SMS_FROM:}
messages.whatsapp.enabled=${WHATSAPP_ENABLED:false}
messages.whatsapp.from=${TWILIO_WHATSAPP_FROM:}
messages.whatsapp.content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
messages.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
messages.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Distributed tracing: W3C context across HTTP, Kafka and the durable order outbox.
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.tracing.propagation.type=w3c
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.reactor.context-propagation=auto
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
