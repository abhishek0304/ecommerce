{
  "groups": [
    {
      "name": "ecommerce",
      "rules": [
        {
          "alert": "EcommerceServiceDown",
          "expr": "up{job=\"ecommerce\"} == 0",
          "for": "2m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Service scrape is failing; inspect readiness and dependencies"
          }
        },
        {
          "alert": "EcommerceHttpErrors",
          "expr": "sum by (application) (rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) / clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05",
          "for": "5m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "HTTP server error ratio exceeds 5%; inspect traces before retrying writes"
          }
        },
        {
          "alert": "EcommerceHttpLatency",
          "expr": "histogram_quantile(0.95, sum by (le,application) (rate(http_server_requests_seconds_bucket[5m]))) > 1",
          "for": "10m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "HTTP p95 exceeds one second; inspect pools and downstream latency"
          }
        },
        {
          "alert": "EcommerceStalledWork",
          "expr": "ecommerce_operations_stale > 0",
          "for": "5m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Background work older than 15 minutes needs recovery inspection"
          }
        },
        {
          "alert": "EcommerceMetricsCollectorStale",
          "expr": "ecommerce_operations_collection_age_seconds > 120",
          "for": "2m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Database queue metrics have stopped refreshing"
          }
        },
        {
          "alert": "EcommerceHeapPressure",
          "expr": "sum by(application) (jvm_memory_used_bytes{area=\"heap\"}) / sum by(application) (jvm_memory_max_bytes{area=\"heap\"}) > 0.85",
          "for": "10m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "JVM heap usage exceeds 85%; inspect load and GC"
          }
        }
      ]
    }
  ]
}
