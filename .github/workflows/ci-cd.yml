name: Ecommerce CI and deployment
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured development Kubernetes cluster
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ecommerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      migration-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MIGRATION_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      MYSQL_USER: root
      MYSQL_PWD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Service tests
        run: bash mvnw -B verify
      - name: Install MySQL backup clients
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Load checker failure-path tests
        run: python3 scripts/test-operations-tools.py
      - name: Isolated schema backup and restore drill
        run: python3 scripts/verify-mysql-operations.py
      - name: Real catalog load and restart drill
        run: python3 scripts/verify-local-capacity.py
      - name: Validate monitoring rules and timing
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infra/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/infra/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.test.yml
          docker run --rm --entrypoint amtool -v "$PWD/infra/monitoring:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Validate deployment consistency
        run: python3 scripts/validate-infra.py
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - name: Render Kubernetes manifests
        run: kubectl kustomize infra/k8s/observability > /tmp/ecommerce.yaml
      - name: Validate Kubernetes schemas
        run: docker run --rm -v /tmp/ecommerce.yaml:/manifests.yaml:ro ghcr.io/yannh/kubeconform:v0.8.0-alpine -strict -summary -kubernetes-version 1.32.3 /manifests.yaml
      - name: Validate Compose with disposable CI credentials
        shell: pwsh
        run: |
          ./scripts/init-env.ps1
          docker compose --profile app --profile observability config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            .deployment-evidence/*.json
          include-hidden-files: true
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create disposable credentials
        shell: pwsh
        run: ./scripts/init-env.ps1
      - name: Build product and cart images
        run: docker compose --profile app build product-service cart-service
      - name: Verify container bootstrap, cache and readiness
        shell: pwsh
        run: ./scripts/smoke-compose.ps1

  images:
    needs: [test, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: config-server
            module: config-server/config-server
          - name: service-registry
            module: service-registry/service-registry
          - name: api-gateway
            module: api-gateway
          - name: user-service
            module: user-service/user-service
          - name: product-service
            module: product-service
          - name: cart-service
            module: cart-service
          - name: order-service
            module: order-service
          - name: notification-service
            module: notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: MODULE=${{ matrix.module }}
          tags: ghcr.io/${{ env.OWNER }}/ecommerce-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  deploy:
    needs: images
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          test -n "$KUBE_CONFIG"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy immutable images
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 scripts/set-k8s-images.py
          kubectl -n ecommerce get secret ecommerce-secrets >/dev/null
          kubectl apply -k infra/k8s/observability
          for service in config-server service-registry api-gateway user-service product-service cart-service order-service notification-service; do
            kubectl -n ecommerce rollout status deployment/"$service" --timeout=600s
          done
