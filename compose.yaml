{
  "name": "ecommerce",
  "services": {
    "kafka": {
      "image": "apache/kafka:3.9.1",
      "ports": [
        "127.0.0.1:9092:9092"
      ],
      "environment": {
        "KAFKA_NODE_ID": "1",
        "KAFKA_PROCESS_ROLES": "broker,controller",
        "KAFKA_LISTENERS": "PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093",
        "KAFKA_ADVERTISED_LISTENERS": "PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "PLAINTEXT",
        "KAFKA_CONTROLLER_LISTENER_NAMES": "CONTROLLER",
        "KAFKA_CONTROLLER_QUORUM_VOTERS": "1@kafka:9093",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "1",
        "KAFKA_LOG_DIRS": "/tmp/kraft-combined-logs",
        "KAFKA_HEAP_OPTS": "-Xms128m -Xmx256m"
      },
      "volumes": [
        "kafka-data:/tmp/kraft-combined-logs"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--bootstrap-server",
          "localhost:19092",
          "--list"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 18
      },
      "restart": "unless-stopped",
      "mem_limit": "512m"
    },
    "redis": {
      "image": "redis:7.4.2-alpine",
      "profiles": [
        "app"
      ],
      "command": [
        "sh",
        "-c",
        "exec redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy allkeys-lru"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?Run scripts/init-env.ps1 first}"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10
      },
      "restart": "unless-stopped",
      "mem_limit": "192m"
    },
    "config-server": {
      "image": "ecommerce/config-server:local",
      "build": {
        "context": ".",
        "args": {
          "MODULE": "config-server/config-server"
        }
      },
      "profiles": [
        "app"
      ],
      "environment": {
        "SPRING_PROFILES_ACTIVE": "container,native",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:19092",
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.ps1 first}",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?Run scripts/init-env.ps1 first}",
        "PRODUCT_SERVICE_URL": "http://product-service:8083",
        "CART_SERVICE_URL": "http://cart-service:8084",
        "USER_SERVICE_URL": "http://user-service:8082",
        "CONFIG_REPO_LOCATION": "file:/config-repo/",
        "SPRING_CLOUD_CONFIG_ENABLED": "false",
        "CONFIG_SERVER_IMPORT": "classpath:/application-container.properties",
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=50.0 -XX:ReservedCodeCacheSize=64m -Xss512k"
      },
      "depends_on": {
        "service-registry": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:9090/actuator/health/readiness"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 24,
        "start_period": "60s"
      }
    },
    "service-registry": {
      "image": "ecommerce/service-registry:local",
      "build": {
        "context": ".",
        "args": {
          "MODULE": "service-registry/service-registry"
        }
      },
      "profiles": [
        "app"
      ],
      "environment": {
        "SPRING_PROFILES_ACTIVE": "container",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:19092",
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.ps1 first}",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?Run scripts/init-env.ps1 first}",
        "PRODUCT_SERVICE_URL": "http://product-service:8083",
        "CART_SERVICE_URL": "http://cart-service:8084",
        "USER_SERVICE_URL": "http://user-service:8082",
        "SPRING_CLOUD_CONFIG_ENABLED": "false",
        "CONFIG_SERVER_IMPORT": "classpath:/application-container.properties",
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=50.0 -XX:ReservedCodeCacheSize=64m -Xss512k"
      },
      "depends_on": {},
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:9090/actuator/health/readiness"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 24,
        "start_period": "60s"
      }
    },
    "api-gateway": {
      "image": "ecommerce/api-gateway:local",
      "build": {
        "context": ".",
        "args": {
          "MODULE": "api-gateway"
        }
      },
      "profiles": [
        "app"
      ],
      "environment": {
        "SPRING_PROFILES_ACTIVE": "container",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:19092",
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.ps1 first}",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?Run scripts/init-env.ps1 first}",
        "PRODUCT_SERVICE_URL": "http://product-service:8083",
        "CART_SERVICE_URL": "http://cart-service:8084",
        "USER_SERVICE_URL": "http://user-service:8082",
        "SPRING_CLOUD_CONFIG_ENABLED": "false",
        "CONFIG_SERVER_IMPORT": "classpath:/application-container.properties",
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=50.0 -XX:ReservedCodeCacheSize=64m -Xss512k",
        "TRACING_SAMPLE_RATE": "${TRACING_SAMPLE_RATE:-1.0}",
        "MANAGEMENT_TRACING_ENABLED": "${MANAGEMENT_TRACING_ENABLED:-true}",
        "OTLP_TRACES_ENDPOINT": "${OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      },
      "depends_on": {
        "service-registry": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "ports": [
        "127.0.0.1:8081:8081"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:9090/actuator/health/readiness"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 24,
        "start_period": "60s"
      }
    },
    "user-db": {
      "image": "mysql:8.4.4",
      "profiles": [
        "app"
      ],
      "environment": {
        "MYSQL_DATABASE": "userdb",
        "MYSQL_USER": "user",
        "MYSQL_PASSWORD": "${USER_DB_PASSWORD:?Run scripts/init-env.ps1 first}",
        "MYSQL_ROOT_PASSWORD": "${USER_DB_PASSWORD}"
      },
      "volumes": [
        "user-db:/var/lib/mysql"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e \"SELECT 1\""
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 30,
        "start_period": "120s"
      },
      "restart": "unless-stopped",
      "command": [
        "--innodb-buffer-pool-size=64M",
        "--innodb-log-buffer-size=8M",
        "--performance-schema=OFF",
        "--max-connections=30"
      ],
      "mem_limit": "384m"
    },
    "user-service": {
      "image": "ecommerce/user-service:local",
      "build": {
        "context": ".",
        "args": {
          "MODULE": "user-service/user-service"
        }
      },
      "profiles": [
        "app"
      ],
      "environment": {
        "SPRING_PROFILES_ACTIVE": "container",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:19092",
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.ps1 first}",
        "INTERNAL_SERVICE_KEY": "${INTERNAL_SERVICE_KEY:?Run scripts/init-env.ps1 first}",
        "PRODUCT_SERVICE_URL": "http://product-service:8083",
        "CART_SERVICE_URL": "http://cart-service:8084",
        "USER_SERVICE_URL": "http://user-service:8082",
        "SPRING_DATASOURCE_URL": "jdbc:mysql://user-db:3306/userdb",
        "SPRING_DATASOURCE_USERNAME": "user",
        "SPRING_DATASOURCE_PASSWORD": "${USER_DB_PASSWORD}",
        "SPRING_CLOUD_CONFIG_ENABLED": "false",
        "CONFIG_SERVER_IMPORT": "classpath:/application-container.properties",
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=50.0 -XX:ReservedCodeCacheSize=64m -Xss512k",
        "SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE": "5",
        "SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE": "1",
        "TRACING_SAMPLE_RATE": "${TRACING_SAMPLE_RATE:-1.0}",
        "MANAGEMENT_TRACING_ENABLED": "${MANAGEMENT_TRACING_ENABLED:-true}",
        "OTLP_TRACES_ENDPOINT": "${OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      },
      "depends_on": {
        "service-registry": {
          "condition": "service_healthy"
        },
        "kafka": {
          "condition": "service_healthy"
        },
        "user-db": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:9090/actuator/health/readiness"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 24,
        "start_period": "60s"
      }
    },
