spring.application.name=cart-service
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:carttest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
security.jwt.secret=change-this-development-secret-key-to-at-least-32-bytes
product-service.url=http://localhost:8083

app.circuit-breaker.enabled=false
