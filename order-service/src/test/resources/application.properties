spring.application.name=order-service
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:ordertest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
security.jwt.secret=change-this-development-secret-key-to-at-least-32-bytes
internal.service-key=test-service-key
cart-service.url=http://localhost:8084
product-service.url=http://localhost:8083
user-service.url=http://localhost:8082
razorpay.key-id=rzp_test_local
razorpay.key-secret=test-provider-secret
razorpay.webhook-secret=test-webhook-secret
order.recovery.enabled=false
order.outbox.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app.circuit-breaker.enabled=false
