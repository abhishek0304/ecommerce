spring.application.name=order-service
spring.config.import=${CONFIG_SERVER_IMPORT:configserver:http://localhost:8080}
server.port=8085
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/orderdb}
spring.datasource.username=${ORDER_DB_USERNAME:root}
spring.datasource.password=${ORDER_DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
internal.service-key=${INTERNAL_SERVICE_KEY:local-development-service-key-change-me}
cart-service.url=${CART_SERVICE_URL:http://localhost:8084}
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
user-service.url=${USER_SERVICE_URL:http://localhost:8082}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
order.recovery.enabled=true
order.recovery.delay-ms=30000
management.endpoints.web.exposure.include=health,info
order.payment-timeout=${ORDER_PAYMENT_TIMEOUT:15m}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.admin.operation-timeout=10s
order.outbox.enabled=true
order.outbox.delay-ms=5000

# Distributed tracing: W3C context across HTTP, Kafka and the durable order outbox.
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.tracing.propagation.type=w3c
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.reactor.context-propagation=auto
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
